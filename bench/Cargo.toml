# The benchmark project is deliberately outside the StochCraft workspace (see the root
# Cargo.toml `exclude`), so the engines it compares against never enter StochCraft's lock file,
# layer check or licence policy.
[workspace]

[package]
name = "stochcraft-bench"
description = "Speed benchmarks: M/M/1 against simu-des with a SimPy twin, tandem lines, the hold model and DEVStone."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
stochcraft-des = { path = "../crates/des" }
stochcraft-blocks = { path = "../crates/blocks" }
stochcraft-model = { path = "../crates/model" }
stochcraft-random = { path = "../crates/random" }
stochcraft-experiment = { path = "../crates/experiment" }
# The generator as it was before streams could read a file of random bytes (main at d4b0441a,
# copied), for the `rng` benchmark: the old code in a crate of its own, against the current one.
stochcraft-random-before = { path = "random-before" }
# simu-des 0.1.0 (MIT OR Apache-2.0), a SimPy-style Rust engine.
simu-des = { version = "=0.1.0", optional = true }

[features]
default = ["simu"]
simu = ["dep:simu-des"]

[profile.release]
debug = "line-tables-only"

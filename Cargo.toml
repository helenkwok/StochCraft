[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Benchmarks against other engines live in their own Cargo project (bench/Cargo.toml).
exclude = ["bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["StochCraft contributors"]
repository = "https://github.com/helenkwok/StochCraft"
publish = false

[workspace.dependencies]
stochcraft-des = { path = "crates/des" }
stochcraft-random = { path = "crates/random" }
stochcraft-model = { path = "crates/model" }
stochcraft-stats = { path = "crates/stats" }
stochcraft-experiment = { path = "crates/experiment" }
stochcraft-blocks = { path = "crates/blocks" }
stochcraft-io = { path = "crates/io" }
stochcraft-engine = { path = "crates/engine" }
stochcraft-testkit = { path = "crates/testkit" }
stochcraft-ui-egui = { path = "crates/ui-egui" }

# The interface (L5 and the apps): egui on the Craft suite's reviewed fork, pinned to the same
# revisions as CADCraft (see [patch.crates-io] below), and craft-libs, the Craft suite's shared
# app foundation, all at one commit (it uses the same egui fork revision). Bump them together.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = { version = "0.37", default-features = false }
craft-atomic = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471" }
craft-dialogs = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471" }
craft-keymap = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471", features = ["egui"] }
craft-menu = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471" }
craft-platform = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471" }
craft-quit = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471", features = ["egui"] }
craft-settings = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471" }
craft-window = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "d836bea31b7d33d83023edc6bab9cd8059232471", features = ["egui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The complete egui family on the Craft suite's fork, at the commit CADCraft uses, so every Craft
# app draws and behaves alike. Bump all of them together.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

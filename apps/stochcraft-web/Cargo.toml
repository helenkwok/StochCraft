[package]
name = "stochcraft-web"
description = "StochCraft in the browser (eframe's web runner, WebGL2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "stochcraft-web"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
stochcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit"] }
egui = { workspace = true }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Event", "BeforeUnloadEvent"] }

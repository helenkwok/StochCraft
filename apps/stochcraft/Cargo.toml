[package]
name = "stochcraft"
description = "StochCraft, the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
stochcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
craft-atomic = { workspace = true }
craft-dialogs = { workspace = true }
craft-menu = { workspace = true }
craft-quit = { workspace = true }
craft-settings = { workspace = true }
# Installed fonts fill in for scripts the interface's own faces lack (craft-ui's font stack).
craft-ui = { workspace = true, features = ["system_fonts"] }
craft-window = { workspace = true }
serde = { version = "1", features = ["derive"] }
# The local data folder, for the recovery copy of unsaved changes (also used by craft-settings).
dirs = "7"

[dev-dependencies]
serde_json = "1"

name: Pages deploy

# Serves the `gh-pages` branch on GitHub Pages with actions/deploy-pages: `main`'s build at the
# site's root and each open pull request's at `pr/<number>/`, as the Pages workflow keeps them.
#
# It runs after every Pages or Pages cleanup run (and on demand), from `main`'s context: the `github-pages`
# environment only lets the default branch deploy, which a pull request's own run is not.
#
# Needs Settings → Pages → Build and deployment → Source = "GitHub Actions" (once).

on:
  workflow_run:
    workflows: [Pages, Pages cleanup]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  # A deployment in progress finishes; the next one then serves the newest tree.
  cancel-in-progress: false

jobs:
  build:
    name: Collect gh-pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

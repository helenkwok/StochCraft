name: Pages deploy

# Serves the `gh-pages` branch on GitHub Pages with actions/deploy-pages: `main`'s build at the
# site's root and each open pull request's at `pr/<number>/`, as the Pages workflow keeps them.
#
# It runs after every Pages or Pages cleanup run (and on demand), from `main`'s context: the `github-pages`
# environment only lets the default branch deploy, which a pull request's own run is not.
#
# Needs Settings → Pages → Build and deployment → Source = "GitHub Actions" (once).

on:
  workflow_run:
    workflows: [Pages, Pages cleanup]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  # A deployment in progress finishes; the next one then serves the newest tree.
  cancel-in-progress: false

jobs:
  build:
    name: Collect gh-pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Pages cleanup

# Closing a pull request has nothing to delete (its preview lives in an Actions artifact, and
# pages-deploy.yml serves only open pull requests' previews). This workflow exists so that the
# closing starts pages-deploy.yml, which then deploys the site without that preview.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  closed:
    name: Pull request closed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Pull request ${PR} closed; Pages deploy follows."
        env:
          PR: ${{ github.event.pull_request.number }}

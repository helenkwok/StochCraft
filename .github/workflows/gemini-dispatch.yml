# Routes "@gemini-cli /review" comments, manual runs, and CodeRabbit's "rate limited" comments to
# gemini-review.yml: Gemini reviews a pull request automatically only while CodeRabbit is out of
# reviews, at most once per head commit. Once a review has hit the free tier's daily quota, requests
# skip Gemini without calling it until the quota resets (midnight Pacific time), and one comment per
# pull request says so.
# Adapted from google-github-actions/run-gemini-cli, examples/workflows/gemini-dispatch (Apache-2.0);
# the triage, invoke and plan-execute routes and the GitHub App token steps are removed.
name: 'Gemini Dispatch'

on:
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  issue_comment:
    types:
      - 'created'
      # CodeRabbit edits its summary comment in place when it runs out of reviews.
      - 'edited'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Number of the pull request to review'
        required: true
        type: 'string'

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__issue__author_association: '${{ github.event.issue.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'

  dispatch:
    # For CodeRabbit: only its own comment on a pull request saying it is rate limited.
    # For comments: only on a pull request, and only if the user types @gemini-cli and is OWNER,
    # MEMBER or COLLABORATOR.
    # For manual runs: anyone with write access can start the workflow from the Actions tab.
    # Comments and manual runs are checked again in 'Extract command': the event does not say
    # whether the pull request comes from a fork.
    if: |-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'coderabbitai[bot]' &&
        contains(github.event.comment.body, 'rate limited by coderabbit.ai')
      ) || (
        github.event_name == 'workflow_dispatch'
      ) || (
        github.event.action != 'edited' &&
        (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
      )
    # One dispatch at a time per pull request, so two "rate limited" edits do not both review.
    concurrency:
      group: 'gemini-dispatch-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
      cancel-in-progress: false
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.decide.outputs.command }}'
      request: '${{ steps.extract_command.outputs.request }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
      head_sha: '${{ steps.extract_command.outputs.head_sha }}'
      coderabbit_out: '${{ steps.extract_command.outputs.coderabbit_out }}'
      quota_resets: '${{ steps.quota_day.outputs.resets }}'
      quota_eta: '${{ steps.quota_day.outputs.eta }}'
    steps:
      - name: 'Extract command'
        id: 'extract_command'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EVENT_TYPE: '${{ github.event_name }}.${{ github.event.action }}'
          COMMENT_USER: '${{ github.event.comment.user.login }}'
          REQUEST: '${{ github.event.comment.body || github.event.review.body }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST || '';
            core.setOutput('request', request);

            const coderabbitOut = eventType.startsWith('issue_comment') &&
              process.env.COMMENT_USER === 'coderabbitai[bot]';
            core.setOutput('coderabbit_out', coderabbitOut ? 'true' : 'false');
            if (coderabbitOut) {
              core.setOutput('request', '');
              core.setOutput('command', 'review');
            } else if (eventType.startsWith('workflow_dispatch')) {
              core.setOutput('command', 'review');
            } else if (request.startsWith("@gemini-cli /review")) {
              core.setOutput('command', 'review');
              const additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
              core.setOutput('additional_context', additionalContext);
            } else {
              core.setOutput('command', 'fallthrough');
              return;
            }

            // Comments and manual runs name a pull request without the event saying where it
            // comes from: review only branches of this repository, and not Dependabot's.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PULL_REQUEST_NUMBER),
            });
            const ownRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== ownRepo || pr.user.login === 'dependabot[bot]') {
              core.notice(`Pull request #${pr.number} comes from ${pr.head.repo?.full_name ?? 'a deleted fork'}; not reviewed.`);
              core.setOutput('command', 'skip');
              return;
            }
            core.setOutput('head_sha', pr.head.sha);

            // Standing in for CodeRabbit: once per head commit. The acknowledgement below
            // carries a marker with the commit it is for.
            if (coderabbitOut) {
              const marker = `<!-- gemini-stand-in: ${pr.head.sha} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              if (comments.some((c) => (c.body || '').includes(marker))) {
                core.notice(`Gemini already stood in for CodeRabbit on ${pr.head.sha}; not reviewed again.`);
                core.setOutput('command', 'skip');
              }
            }

      # The free tier resets at midnight Pacific time (08:00 UTC in winter, 07:00 UTC in summer), so
      # the quota day is the Pacific date.
      - name: 'Find the quota day'
        id: 'quota_day'
        run: |-
          now="$(date +%s)"
          reset="$(TZ=America/Los_Angeles date -d '00:00 tomorrow' +%s)"
          hours=$(( (reset - now + 1800) / 3600 ))
          if (( hours < 1 )); then
            eta='less than an hour'
          elif (( hours == 1 )); then
            eta='about 1 hour'
          else
            eta="about ${hours} hours"
          fi
          {
            echo "day=$(TZ=America/Los_Angeles date +%F)"
            echo "resets=$(date -u -d "@${reset}" '+%H:%M UTC on %-d %B')"
            echo "eta=${eta}"
          } >> "${GITHUB_OUTPUT}"

      # gemini-review.yml saves this entry when a review fails with "exhausted your daily quota".
      # The path must match the one there: it is part of the cache version. Entries saved by a run
      # on main (comments and CodeRabbit's notes) are seen by every pull request; one saved by a run
      # on a pull request's own ref (a review comment) only by that pull request.
      - name: 'Check the daily-quota marker'
        id: 'quota_gate'
        if: |-
          ${{ steps.extract_command.outputs.command == 'review' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '.gemini-quota/exhausted'
          key: 'gemini-daily-quota-exhausted-${{ steps.quota_day.outputs.day }}'
          lookup-only: 'true'

      - name: 'Decide'
        id: 'decide'
        env:
          COMMAND: '${{ steps.extract_command.outputs.command }}'
          QUOTA_USED_UP: '${{ steps.quota_gate.outputs.cache-hit }}'
        run: |-
          if [[ "${COMMAND}" == 'review' && "${QUOTA_USED_UP}" == 'true' ]]; then
            echo "::notice::Gemini's daily quota is used up; not calling it."
            echo 'command=quota' >> "${GITHUB_OUTPUT}"
          else
            echo "command=${COMMAND}" >> "${GITHUB_OUTPUT}"
          fi

      # One comment per pull request and quota day, updated in place (an edit does not notify).
      - name: 'Say the daily quota is used up'
        if: |-
          ${{ steps.decide.outputs.command == 'quota' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
          QUOTA_DAY: '${{ steps.quota_day.outputs.day }}'
          RESETS: '${{ steps.quota_day.outputs.resets }}'
          ETA: '${{ steps.quota_day.outputs.eta }}'
        with:
          script: |
            const marker = `<!-- gemini-daily-quota: ${process.env.QUOTA_DAY} -->`;
            const body = `Gemini's free daily quota is used up, so no Gemini review runs until it resets at ${process.env.RESETS} (in ${process.env.ETA}). After that, a comment starting with "@gemini-cli /review" asks for one. ${marker}`;
            const issue_number = Number(process.env.PULL_REQUEST_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const mine = comments.find((c) => c.user?.login === 'github-actions[bot]' && (c.body || '').includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: 'Acknowledge request'
        if: |-
          ${{ steps.decide.outputs.command != 'skip' && steps.decide.outputs.command != 'quota' }}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
          MESSAGE: |-
            ${{ steps.extract_command.outputs.coderabbit_out == 'true' && format('CodeRabbit is out of reviews for now, so the Gemini review runs instead. <!-- gemini-stand-in: {0} -->', steps.extract_command.outputs.head_sha) || format('Hi @{0}, I''ve received your request, and I''m working on it now!', github.actor) }} You can track progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

  review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
      pull_request_number: '${{ needs.dispatch.outputs.issue_number }}'
    secrets: 'inherit'

  fallthrough:
    needs:
      - 'dispatch'
      - 'review'
    # A review that is replaced or runs out of the job's time ends as cancelled, not failed: it must
    # still say so on the pull request.
    if: |-
      ${{ always() && (needs.dispatch.outputs.command == 'fallthrough' || needs.dispatch.result == 'failure' || needs.review.result == 'failure' || needs.review.result == 'cancelled') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      # gemini-review.yml names the cause from the CLI's stderr; it is empty when the review job
      # was cancelled or never started.
      - name: 'Send failure comment'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}'
          COMMAND: '${{ needs.dispatch.outputs.command }}'
          CAUSE: '${{ needs.review.outputs.cause }}'
          QUOTA_RESETS: '${{ needs.dispatch.outputs.quota_resets }}'
          QUOTA_ETA: '${{ needs.dispatch.outputs.quota_eta }}'
          LOGS_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          again='A comment starting with "@gemini-cli /review" tries again.'
          if [[ "${COMMAND}" == 'fallthrough' ]]; then
            message='Only "@gemini-cli /review" is supported here.'
          else
            case "${CAUSE}" in
              quota)
                message="The Gemini review stopped: the free tier's daily limit of 20 requests is used up. It resets at ${QUOTA_RESETS} (in ${QUOTA_ETA}); until then, requests skip Gemini without calling it."
                ;;
              503)
                message="The Gemini review stopped after two failed requests, usually the model answering 503 (high demand). It is stopped early because every retry counts against the free tier's daily limit of 20 requests. ${again}"
                ;;
              time)
                message="The Gemini review ran out of its 5 minutes. ${again}"
                ;;
              other)
                message="The Gemini review failed. ${again}"
                ;;
              *)
                message="The Gemini review did not finish: it was cancelled, replaced by a newer review, or did not start. ${again}"
                ;;
            esac
          fi
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${message} [See the logs](${LOGS_URL}) for details." \
            --repo "${REPOSITORY}"

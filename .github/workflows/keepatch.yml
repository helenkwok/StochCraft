name: Keepatch maintenance report

# A weekly, read-mostly run: it ranks open pull requests, failing checks and bug reports, and keeps
# one report issue plus one issue per task that needs work. It never checks out or runs pull
# request code, never pushes and never merges.
#
# GitHub turns scheduled workflows off after 60 days without repository activity; the report
# issue's "Updated" line shows whether this is still running.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report without writing any issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: keepatch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/keepatch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/keepatch/keepatch.mjs --self-test
      # TinyDecide (Apache-2.0) at one pinned commit, checked against known checksums. It only adds
      # a shadow column to the report; if the download or a checksum fails, the report runs without it.
      - name: Fetch TinyDecide (pinned and checksummed)
        id: tinydecide
        continue-on-error: true
        env:
          BASE: https://huggingface.co/TheREZOR/TinyDecide/resolve/aa745b73a2db9a43bce731f0e8e5c90a6899fe2c
        run: |
          mkdir -p "$RUNNER_TEMP/tinydecide" && cd "$RUNNER_TEMP/tinydecide"
          for f in tinydecide.js meta.json model.bin; do curl -sfL --retry 2 -o "$f" "$BASE/$f"; done
          sha256sum -c <<'EOF'
          577fb33b169b370711248b94bf4d9c6f61eda5f4f158710f177a96ffe74990d1  tinydecide.js
          2fb895cfb0cdd6b11fcfb5573033e846bf4defadb3c78b9989cccfeefe06758f  meta.json
          23fe9d93f2eafadbe4dc686a7dc5f309fbcba9ea1a4873d457e75d17c5bf3441  model.bin
          EOF
      - name: Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEPATCH_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          KEEPATCH_TINYDECIDE_DIR: ${{ steps.tinydecide.outcome == 'success' && format('{0}/tinydecide', runner.temp) || '' }}
        run: node .github/keepatch/keepatch.mjs

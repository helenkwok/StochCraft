name: CI

# `plan` picks a base commit (a pull request's merge base, or on main the newest commit whose CI
# passed) and `cargo xtask affected` maps the change since it to crates. `cargo xtask ci
# --affected` then lints and tests only those crates and the crates that depend on them. Changes
# to the workspace manifest, the lock file, xtask or the workflows run everything, and so do
# manual runs. The plan logic is adapted from FieldCraft's CI (MIT OR Apache-2.0).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan (affected crates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To find the last green run on main.
      actions: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      everything: ${{ steps.affected.outputs.everything }}
      heavy: ${{ steps.affected.outputs.heavy }}
      wasm: ${{ steps.affected.outputs.wasm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: plan
      - name: Pick the base
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          base=""
          case "$EVENT" in
            push)
              # The newest main commit whose push run passed and that this commit contains, so
              # changes from failed or cancelled runs are tested again here.
              for sha in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[].head_sha'); do
                if [ "$sha" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$sha" HEAD; then
                  base="$sha"
                  break
                fi
              done
              ;;
            pull_request)
              base="$(git merge-base "origin/$PR_BASE" HEAD || true)"
              ;;
          esac
          # Manual runs, or no green run to start from: everything.
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "### Base: \`${base:-none (everything)}\`" >>"$GITHUB_STEP_SUMMARY"
      - name: cargo xtask affected
        id: affected
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            cargo xtask affected --base "$BASE" --github-output | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf 'everything=true\nheavy=true\nwasm=true\n' >>"$GITHUB_OUTPUT"
          fi

  ci:
    name: cargo xtask ci
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci
      # The BPSim reference models and XML Schema are downloaded, never committed (they carry no
      # licence of their own). The cache key changes when the pinned checksums in
      # xtask/src/bpsim.rs do, so bpsim.org is contacted only when the cache is cold.
      - uses: actions/cache@v6
        with:
          path: target/bpsim
          key: bpsim-${{ hashFiles('xtask/src/bpsim.rs') }}
      - name: xmllint (BPSim XML Schema validation)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libxml2-utils
      - name: cargo xtask fetch-bpsim
        run: cargo xtask fetch-bpsim
      - name: cargo xtask ci (the affected crates, or everything)
        env:
          BASE: ${{ needs.plan.outputs.base }}
          EVERYTHING: ${{ needs.plan.outputs.everything }}
          # The reference-model tests must run here, not skip.
          STOCHCRAFT_REQUIRE_BPSIM: "1"
        run: |
          if [ -n "$BASE" ] && [ "$EVERYTHING" != "true" ]; then cargo xtask ci --affected "$BASE"; else cargo xtask ci; fi

  heavy:
    name: Heavy tests (#[ignore]d)
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: heavy
      - run: cargo test --workspace --release --locked -- --ignored

  # The BPSim reference-model and schema tests on Windows, where file paths and temporary files
  # differ from Linux. xmllint is MSYS2's native mingw64 build (MSYS2 is preinstalled on the
  # runner); only its mingw64 folder goes on PATH, since MSYS2's usr/bin has a link.exe that
  # would shadow MSVC's linker.
  windows:
    name: Reference tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The tests compare files byte for byte, so check out with the repository's LF endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      - uses: actions/cache@v6
        with:
          path: target/bpsim
          key: bpsim-${{ hashFiles('xtask/src/bpsim.rs') }}
      - name: xmllint (MSYS2 mingw64 libxml2)
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-libxml2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Git for Windows' usr/bin has the unzip that fetch-bpsim needs; it goes last on PATH.
      - name: cargo xtask fetch-bpsim
        run: |
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin"
          cargo xtask fetch-bpsim
      - name: cargo test (reference models and schema)
        env:
          STOCHCRAFT_REQUIRE_BPSIM: "1"
        run: |
          xmllint --version
          cargo test -p stochcraft-io --locked --test reference

  wasm:
    name: wasm32 check
    needs: plan
    if: needs.plan.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The craft-fonts commit pages.yml builds with (CRAFT_FONTS_REV there), so the table of
      # served faces the web build compiles in is checked here too.
      - uses: actions/checkout@v7
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      # Node runs the wasm32-wasip1 test binary through its built-in WASI (xtask/wasi-run.mjs). This
      # job uses the latest LTS release of Node; wasi-run.mjs works around a Node 22 crash (#102).
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: cargo xtask wasm
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
      # The golden models must give the results pinned natively (tests/golden/results.txt).
      - run: cargo xtask golden
      # Again on Node 22, the oldest Node LTS CONTRIBUTING supports, so the wasi-run.mjs
      # workaround for its crash stays tested (#102). The test binary is already built.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --version && cargo xtask golden

  bench:
    name: Benchmarks build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench
          workspaces: bench
      # The bench project is outside the workspace; this keeps it compiling as the engine changes.
      - run: cargo fmt --manifest-path bench/Cargo.toml --check
      - run: cargo clippy --manifest-path bench/Cargo.toml --locked --release -- -D warnings
      - run: cargo run --release --manifest-path bench/Cargo.toml --locked -- all 20000 4

  licences:
    name: cargo deny (licences, sources, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses sources bans

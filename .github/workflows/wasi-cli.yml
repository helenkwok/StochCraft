name: CLI on WASI

# Builds stochcraft-cli for wasm32-wasip1 and runs the M/M/1 model with it under Node's built-in
# WASI (the same way `cargo xtask golden` runs the golden results), then keeps the .wasm as a
# workflow artifact. Purpose: a server-side function (a Forge app's Node function) can run a model
# by loading this one file, with no worker threads and no native code. Nothing is published.

on:
  workflow_dispatch:
  push:
    branches: [forge-wasi-cli]

permissions:
  contents: read

concurrency:
  group: wasi-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wasi-cli:
    name: Build and run stochcraft-cli on WASI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasi-cli
      - name: Build stochcraft-cli for wasm32-wasip1
        run: cargo build --release --locked -p stochcraft-cli --target wasm32-wasip1
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run the M/M/1 model under Node's WASI
        run: |
          set -euo pipefail
          wasm=target/wasm32-wasip1/release/stochcraft-cli.wasm
          ls -l "$wasm"
          cat >run-wasi.mjs <<'EOF'
          // Usage: node run-wasi.mjs program.wasm <model dir> args...  (the model dir is /work in the program)
          import { readFile } from "node:fs/promises";
          import { WASI } from "node:wasi";
          import { argv, exit, versions } from "node:process";
          import { setFlagsFromString } from "node:v8";
          if (Number(versions.node.split(".")[0]) < 24) setFlagsFromString("--no-turbo-fast-api-calls");
          const [program, dir, ...args] = argv.slice(2);
          const wasi = new WASI({ version: "preview1", args: ["stochcraft-cli", ...args], preopens: { "/work": dir }, returnOnExit: true });
          const module = await WebAssembly.compile(await readFile(program));
          const instance = await WebAssembly.instantiate(module, wasi.getImportObject());
          exit(wasi.start(instance));
          EOF
          time node --no-warnings run-wasi.mjs "$wasm" tests/models run /work/mm1.bpmn --reps 16 --seed 2026 --threads 1 --format json > wasi-result.json
          head -c 600 wasi-result.json; echo
          node -e 'const r=JSON.parse(require("fs").readFileSync("wasi-result.json","utf8"));console.log("keys:",Object.keys(r).join(","))'
      - name: The native build gives the same results
        # The run record names the model file as each run saw it (/work/mm1.bpmn under WASI,
        # tests/models/mm1.bpmn natively), so only its base name is compared; any timing field is
        # left out. Everything else must match exactly, or the step fails naming the first field
        # that differs.
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p stochcraft-cli -- run tests/models/mm1.bpmn --reps 16 --seed 2026 --threads 1 --format json > native-result.json
          cat >compare.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          import { exit } from "node:process";
          const timing = /^(elapsed|seconds|duration_ms|started|finished|wall)/i;
          const load = (path) => {
            const r = JSON.parse(readFileSync(path, "utf8"));
            if (r.record && typeof r.record.file === "string") r.record.file = r.record.file.split("/").pop();
            return r;
          };
          // The first path where a and b differ, or null.
          const differ = (a, b, path) => {
            if (typeof a !== typeof b || Array.isArray(a) !== Array.isArray(b) || (a === null) !== (b === null)) return path;
            if (a === null || typeof a !== "object") return a === b ? null : path;
            const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
            for (const k of [...keys].sort()) {
              if (timing.test(k)) continue;
              const d = differ(a[k], b[k], `${path}/${k}`);
              if (d) return d;
            }
            return null;
          };
          const at = differ(load("wasi-result.json"), load("native-result.json"), "");
          if (at) {
            console.log(`WASI and native results differ at ${at}`);
            exit(1);
          }
          console.log("WASI and native results are identical");
          EOF
          node compare.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stochcraft-cli-wasip1
          path: |
            target/wasm32-wasip1/release/stochcraft-cli.wasm
            wasi-result.json
            native-result.json
            run-wasi.mjs
          if-no-files-found: warn

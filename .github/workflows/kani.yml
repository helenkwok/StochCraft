name: Kani

# Machine-checked proofs of a few core invariants with Kani, the bounded model checker for Rust
# (MIT OR Apache-2.0). The harnesses sit in `#[cfg(kani)] mod proofs` beside the code they check
# (stochcraft-random, stochcraft-stats); normal builds never see them. What is and is not proved
# is in docs/developers.md ("Machine-checked proofs").

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/kani.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          args: "-p stochcraft-random -p stochcraft-stats -Z unstable-options --harness-timeout 5m"

name: Pages

# The browser app on GitHub Pages: this workflow builds it and keeps the site's files on the
# `gh-pages` branch, `main`'s build at the root and each pull request's at `pr/<number>/`, so a
# change to the interface can be tried before it is merged. pages-cleanup.yml removes a pull
# request's preview when it closes, and pages-deploy.yml serves the branch with
# actions/deploy-pages.
#
# Pull requests from forks are built but not published: their token cannot push.
#
# Fonts: the build serves craft-fonts' faces (Japanese, Korean, Chinese, Thai, Hindi…) beside the
# wasm, from a checkout pinned below (crates/ui-egui/build.rs). main's build copies them into the
# site as `fonts/`. A pull request's build doesn't: its preview, at `pr/<number>/`, fetches the
# main site's copy at `../../fonts/` (STOCHCRAFT_PAGES_PREVIEW=1), which keeps ~31 MB out of each
# preview. The trade-off: a pull request that adds a face or bumps the pinned craft-fonts commit
# can't show the new face in its preview until it merges, since the preview asks the main site,
# which doesn't have it yet; and a face main removes stops loading in older previews.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "bench/**", "xtask/src/bpsim.rs"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["**.md", "docs/**", "bench/**", "xtask/src/bpsim.rs"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14
  # storytold/craft-fonts (OFL faces), pinned; ci.yml's wasm job checks out the same commit.
  CRAFT_FONTS_REV: aced4137c022f1f587624d48e81ec77e1914a9cc

jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REV }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pages
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: trunk build --release
        working-directory: apps/stochcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          # A missing or unreadable checkout fails the build instead of shipping no fonts.
          CRAFT_FONTS_REQUIRED: "1"
          # A pull request's preview fetches the main site's fonts and copies none (see the top).
          STOCHCRAFT_PAGES_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: trunk build --release --public-url ./
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/web
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Not for forks (no push rights), and never two at once (they share the branch).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web
      - name: Check out gh-pages (or start it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi
      - name: Place the build
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            target="site/pr/$PR"
            rm -rf "$target"
            mkdir -p "$target"
            cp -r web/. "$target/"
            # Previews use the main site's fonts (../../fonts/); never keep a copy here.
            rm -rf "$target/fonts"
          else
            # main replaces everything but the previews.
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name pr -exec rm -rf {} +
            cp -r web/. site/
          fi
          touch site/.nojekyll
      - name: Push
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Publish ${PR:+pull request #$PR }${SHA}"
          for i in 1 2 3; do
            git push origin gh-pages && exit 0
            # Another publish pushed first: start again from its result.
            git pull --rebase origin gh-pages || exit 1
          done
          exit 1
      - name: Link the preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner,,}.github.io/${repo}/"
          if [ -z "$PR" ]; then
            echo "### Published: ${base}" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="${base}pr/${PR}/"
          echo "### Preview: ${url}" >>"$GITHUB_STEP_SUMMARY"
          marker="<!-- stochcraft-pages-preview -->"
          body="${marker}
          **Preview of the browser app:** ${url} (built from ${SHA:0:7}; it can take a minute to appear)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

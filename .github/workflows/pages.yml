name: Pages

# The browser app on GitHub Pages: this workflow builds it and keeps the site's files on the
# `gh-pages` branch, `main`'s build at the root and each pull request's at `pr/<number>/`, so a
# change to the interface can be tried before it is merged. pages-cleanup.yml removes a pull
# request's preview when it closes, and pages-deploy.yml serves the branch with
# actions/deploy-pages.
#
# Pull requests from forks are built but not published: their token cannot push.
#
# Fonts: the build serves craft-fonts' faces (Japanese, Korean, Chinese, Thai, Hindi…) beside the
# wasm, from a checkout pinned below (crates/ui-egui/build.rs). main's build copies them into the
# site as `fonts/`. A pull request's build doesn't: its preview, at `pr/<number>/`, fetches the
# main site's copy at `../../fonts/` (STOCHCRAFT_PAGES_PREVIEW=1), which keeps ~31 MB out of each
# preview. The trade-off: a pull request that adds a face or bumps the pinned craft-fonts commit
# can't show the new face in its preview until it merges, since the preview asks the main site,
# which doesn't have it yet; and a face main removes stops loading in older previews.
#
# main's site is built only from a commit whose CI passed: the workflow_run trigger starts this
# after each CI run on main, and the build goes ahead only for a successful run of a push, from
# that run's commit. Every CI job counts, so a CI failure on main (a new advisory, say) holds the
# site back until it is fixed. A workflow_run trigger can't filter by path, so main's site is
# rebuilt after every green push, documentation-only ones too. Pull requests' previews don't wait
# for CI: they are for trying a change before it is ready, and building them from workflow_run
# would run a pull request's code in main's context, saving into main's caches. A manual run
# builds the branch it is started on, with no CI gate.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["**.md", "docs/**", "bench/**", "xtask/src/bpsim.rs"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14
  # SHA-256 of trunk-x86_64-unknown-linux-gnu.tar.gz in that release, as its own .sha256 asset
  # gives it (https://github.com/trunk-rs/trunk/releases/tag/v0.21.14); the same hash was
  # computed from the downloaded asset. Update both together.
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
  # storytold/craft-fonts (OFL faces), pinned; ci.yml's wasm job checks out the same commit.
  CRAFT_FONTS_REV: aced4137c022f1f587624d48e81ec77e1914a9cc

jobs:
  build:
    name: Build the web app
    # After CI on main: only a green run of a push (not of a manual CI run).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed, not main's newest (workflow_run's own github.sha); empty, and so
          # the default, for pull requests and manual runs.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REV }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pages
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          tarball="$RUNNER_TEMP/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: trunk build --release
        working-directory: apps/stochcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          # A missing or unreadable checkout fails the build instead of shipping no fonts.
          CRAFT_FONTS_REQUIRED: "1"
          # A pull request's preview fetches the main site's fonts and copies none (see the top).
          STOCHCRAFT_PAGES_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: trunk build --release --public-url ./
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/web
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Not for forks (no push rights), and never two at once (they share the branch).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web
      - name: Check out gh-pages (or start it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi
      - name: Place the build
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            target="site/pr/$PR"
            rm -rf "$target"
            mkdir -p "$target"
            cp -r web/. "$target/"
            # Previews use the main site's fonts (../../fonts/); never keep a copy here.
            rm -rf "$target/fonts"
          else
            # main replaces everything but the previews.
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name pr -exec rm -rf {} +
            cp -r web/. site/
          fi
          touch site/.nojekyll
      - name: Push
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Publish ${PR:+pull request #$PR }${SHA}"
          for i in 1 2 3; do
            git push origin gh-pages && exit 0
            # Another publish pushed first: start again from its result.
            git pull --rebase origin gh-pages || exit 1
          done
          exit 1
      - name: Link the preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner,,}.github.io/${repo}/"
          if [ -z "$PR" ]; then
            echo "### Published: ${base}" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="${base}pr/${PR}/"
          echo "### Preview: ${url}" >>"$GITHUB_STEP_SUMMARY"
          marker="<!-- stochcraft-pages-preview -->"
          body="${marker}
          **Preview of the browser app:** ${url} (built from ${SHA:0:7}; it can take a minute to appear)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

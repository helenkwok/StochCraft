# Dependency policy. Licences must be compatible with StochCraft's MIT OR Apache-2.0.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# egui's default fonts (Ubuntu, Hack, Noto Emoji), kept as the fallback for symbols IBM Plex lacks
# (the macOS ⌘ and ⇧ in shortcuts): fonts under their own licences, bundled unmodified.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
# option-ext (via dirs, which craft-settings uses to find the config folder): MPL-2.0, a
# file-level licence; used unmodified from crates.io, it puts no terms on StochCraft's own code.
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The Craft suite's egui and winit forks and craft-libs, pinned by commit in Cargo.toml.
allow-git = [
    "https://github.com/storytold/egui.git",
    "https://github.com/storytold/winit.git",
    "https://github.com/storytold/craft-libs",
]

[advisories]
ignore = [
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6. They reach StochCraft
    # only through accesskit's Linux screen-reader bridge (egui-winit → accesskit_unix → zbus 5),
    # with no release on zbus 6 yet. Unmaintained notices, not vulnerabilities: drop these when
    # accesskit moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via accesskit_unix; no zbus 6 release yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via accesskit_unix; no zbus 6 release yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via accesskit_unix; no zbus 6 release yet" },
]
